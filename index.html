<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcribble - משעתק געז / אמהרית לעברית</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f4f6f9;
      color: #1e293b;
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
      line-height: 1.6;
    }
    .container {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
    }
    h1 {
      margin-top: 0;
      font-size: 1.6rem;
      color: #0f172a;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 20px;
      background: #f8fafc;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-weight: 600; font-size: 0.9rem; }
    select, button {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 0.95rem;
      background: #fff;
      cursor: pointer;
    }
    button.primary { background-color: #2563eb; color: white; border: none; font-weight: 600; }
    button.primary:hover { background-color: #1d4ed8; }
    button.secondary { background-color: #e2e8f0; color: #334155; border: none; }
    button.secondary:hover { background-color: #cbd5e1; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
    textarea {
      width: 100%;
      height: 260px;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1.25rem;
      line-height: 1.8;
      box-sizing: border-box;
      resize: vertical;
    }
    #inputText {
      direction: ltr;
      text-align: left;
      font-family: "Nyala", "Abyssinica SIL", "Noto Sans Ethiopic", serif;
    }
    #outputText {
      direction: rtl;
      text-align: right;
      background-color: #fcfdfe;
      font-family: "David Libre", "Frank Ruhl Libre", "SBL Hebrew", serif;
      font-size: 1.4rem;
    }
    .actions { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
    .note { margin-top: 18px; font-size: 0.85rem; color: #64748b; }
  </style>
</head>
<body>
<div class="container">
  <h1>Transcribble — משעתק געז / אמהרית לעברית</h1>
  <div class="controls">
    <div class="control-group">
      <label for="systemMode">שיטת מיפוי עיצורים:</label>
      <select id="systemMode">
        <option value="geez">אטימולוגי / געז (משמר ח׳, שׂ, צ׳, ק׳)</option>
        <option value="amharic">פונטי / אמהרית מודרנית</option>
      </select>
    </div>
  </div>
  <div class="grid">
    <div>
      <label for="inputText">טקסט מקור (געז / אמהרית):</label>
      <textarea id="inputText" placeholder="הדבק כאן טקסט בכתב אתיופי (פידל)...">መጽሐፈ ኩፋሌ ወለደ ነገረ ሰማይ ወምድር</textarea>
      <div class="actions">
        <button class="secondary" id="sampleButton" type="button">טען דוגמה מספר היובלים (פרק א׳)</button>
        <button class="secondary" id="clearButton" type="button">נקה</button>
      </div>
    </div>
    <div>
      <label for="outputText">תעתיק עברי ללא תנועות:</label>
      <textarea id="outputText" readonly></textarea>
      <div class="actions">
        <button class="primary" id="copyButton" type="button">העתק תוצאה</button>
        <span id="copyStatus" role="status"></span>
      </div>
    </div>
  </div>
  <div class="note">
    התעתיק אינו כולל סימני תנועות. סימנים המבחינים בין עיצורים, כגון שׂ ו־פּ, נשמרים.
    תווים שאינם נתמכים נשארים ללא שינוי.
    <br>
    <strong>מקרא סימני פיסוק בגעז:</strong> <code>፡</code> מומר לרווח |
    <code>።</code> לנקודה | <code>፣</code> לפסיק.
  </div>
</div>
<script>
  const consonantRows = {
    0x1200: { geez: "ה", amharic: "ה" },
    0x1208: { geez: "ל", amharic: "ל" },
    0x1210: { geez: "ח", amharic: "ח" },
    0x1218: { geez: "מ", amharic: "מ" },
    0x1220: { geez: "שׂ", amharic: "ס" },
    0x1228: { geez: "ר", amharic: "ר" },
    0x1230: { geez: "ס", amharic: "ס" },
    0x1238: { geez: "שׁ", amharic: "שׁ" },
    0x1240: { geez: "ק", amharic: "ק" },
    0x1250: { geez: "ק׳", amharic: "ק׳" },
    0x1260: { geez: "ב", amharic: "ב" },
    0x1268: { geez: "ו", amharic: "ו" },
    0x1270: { geez: "ת", amharic: "ת" },
    0x1278: { geez: "צ׳", amharic: "צ׳" },
    0x1280: { geez: "ח׳", amharic: "ח" },
    0x1290: { geez: "נ", amharic: "נ" },
    0x1298: { geez: "נ׳", amharic: "נ׳" },
    0x12A0: { geez: "א", amharic: "א" },
    0x12A8: { geez: "כ", amharic: "כ" },
    0x12B8: { geez: "כ׳", amharic: "ח" },
    0x12C8: { geez: "ו", amharic: "ו" },
    0x12D0: { geez: "ע", amharic: "א" },
    0x12D8: { geez: "ז", amharic: "ז" },
    0x12E0: { geez: "ז׳", amharic: "ז׳" },
    0x12E8: { geez: "י", amharic: "י" },
    0x12F0: { geez: "ד", amharic: "ד" },
    0x12F8: { geez: "ד׳", amharic: "ג׳" },
    0x1300: { geez: "ג׳", amharic: "ג׳" },
    0x1308: { geez: "ג", amharic: "ג" },
    0x1318: { geez: "ג׳", amharic: "ג׳" },
    0x1320: { geez: "ט", amharic: "ט" },
    0x1328: { geez: "צ׳", amharic: "צ׳" },
    0x1330: { geez: "פ׳", amharic: "פ׳" },
    0x1338: { geez: "צ", amharic: "צ" },
    0x1340: { geez: "צ׳", amharic: "צ" },
    0x1348: { geez: "פ", amharic: "פ" },
    0x1350: { geez: "פּ", amharic: "פּ" }
  };
  const punctuation = {
    0x1361: " ", 0x1362: ".", 0x1363: ",", 0x1364: ";",
    0x1365: ":", 0x1366: ":", 0x1367: "?", 0x1368: "¶"
  };
  const finals = { "כ": "ך", "מ": "ם", "נ": "ן", "פ": "ף", "צ": "ץ" };
  const input = document.getElementById("inputText");
  const output = document.getElementById("outputText");
  const system = document.getElementById("systemMode");
  const copyStatus = document.getElementById("copyStatus");

  function transcribe(text, mode) {
    let result = "";
    for (const character of text) {
      const code = character.codePointAt(0);
      if (punctuation[code] !== undefined) {
        result += punctuation[code];
      } else if (code >= 0x1200 && code <= 0x1357 && consonantRows[code - code % 8]) {
        result += consonantRows[code - code % 8][mode];
      } else {
        result += character;
      }
    }
    return result.replace(/([כמנפצ])(?=[\s.,;:?!]|$)/g, letter => finals[letter]);
  }

  function updateOutput() {
    output.value = transcribe(input.value, system.value);
    copyStatus.textContent = "";
  }
  input.addEventListener("input", updateOutput);
  system.addEventListener("change", updateOutput);
  document.getElementById("sampleButton").addEventListener("click", () => {
    input.value = "ዝንቱ ፡ ነገረ ፡ ኩፋሌ ፡ መዋዕለ ፡ ሕግ ፡ ወስምዕ ፡ ለግብረ ፡ ዓመታት ፡ በበሱባዔሆሙ ፡ ወበበኢዮቤልዎሙ ፡ በኵሉ ፡ ዓመታተ ፡ ዓለም ፡ በከመ ፡ ተናገሮ ፡ እግዚአብሔር ፡ ለሙሴ ፡ በደብረ ፡ ሲና ።";
    updateOutput();
  });
  document.getElementById("clearButton").addEventListener("click", () => {
    input.value = "";
    updateOutput();
  });
  document.getElementById("copyButton").addEventListener("click", async () => {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(output.value);
      } else {
        output.select();
        if (!document.execCommand("copy")) throw new Error("Copy failed");
      }
      copyStatus.textContent = "התוצאה הועתקה.";
    } catch (error) {
      copyStatus.textContent = "ההעתקה נכשלה. אפשר לסמן ולהעתיק את התוצאה ידנית.";
    }
  });
  updateOutput();
</script>
</body>
</html>
